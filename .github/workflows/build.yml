name: Build Pro Infrastructure Web App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build App with PyInstaller
      working-directory: ./src
      # خروجی کنسول را نگه می‌داریم تا لاگ‌های زنده در خط فرمان دیده شوند
      run: pyinstaller --onedir --clean --add-data "templates;templates" app.py

    - name: Copy Templates to Root Dist
      run: |
        xcopy /E /I "src\templates" "src\dist\app\templates"

    - name: Create Stop Script Automatically (English Only)
      run: |
        $stopScriptContent = @"
        @echo off
        echo [INFO] Stopping all Infrastructure Manager processes...
        taskkill /F /IM python.exe >nul 2>&1
        taskkill /F /IM app.exe >nul 2>&1
        echo [OK] Processes stopped. Directory is now unlocked.
        timeout /t 2 >nul
        "@
        Set-Content -Path "src/dist/app/stop.bat" -Value $stopScriptContent -Encoding ASCII

    - name: Create Dist Directory
      run: if (!(Test-Path dist)) { mkdir dist }

    - name: Archive Portable Folder into ZIP
      run: Compress-Archive -Path src/dist/app/* -DestinationPath dist/Infrastructure-Manager.zip

    - name: Upload Portable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Infrastructure-Manager-Portable
        path: dist/Infrastructure-Manager.zip
