<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به مدیریت زیرساخت هوشمند</title>
    <style>
        @import url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css');
        body { margin: 0; background-color: #111113; color: #EDEDEF; font-family: 'Vazir', sans-serif; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .login-box { background: #18181B; padding: 40px; border-radius: 12px; border: 1px solid #27272A; width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; color: #3B82F6; }
        input { width: 100%; padding: 12px; background: #111113; border: 1px solid #27272A; border-radius: 8px; color: #fff; box-sizing: border-box; font-family: inherit; }
        button { background: #3B82F6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.2s; }
        button:hover { background: #2563EB; }
        .error { color: #FCA5A5; font-size: 13px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ورود مدیر سیستم</h2>
        <input type="text" id="username" placeholder="نام کاربری (پیش‌فرض: admin)" value="admin">
        <input type="password" id="password" placeholder="رمز عبور (پیش‌فرض: admin)" value="admin">
        <div id="error-msg" class="error"></div>
        <button onclick="doLogin()">ورود به سیستم</button>
    </div>
    <script>
        async function doLogin() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            let errDiv = document.getElementById('error-msg');
            
            let res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            if(res.ok) {
                window.location.href = '/';
            } else {
                let data = await res.json();
                errDiv.style.display = 'block';
                errDiv.innerText = data.message || 'خطا در ورود';
            }
        }
    </script>
</body>
</html>
